note: >-
  LiquidM serves no /.well-known/ discovery document of any kind, on either host.

  platform.liquidm.com is an Ember single-page application fronted by nginx, and
  its server answers EVERY unmatched path with the same SPA shell under HTTP 200.
  All eight probes below returned byte-identical bodies — 7748 bytes of
  text/html, the same ETag as the site root — so each 200 is a soft 404 and not a
  document. This was re-confirmed on 2026-08-13 by comparing content-length and
  content-type across every path; the identical size across unrelated paths is
  the proof. No WellKnown, SecurityTxt, APICatalog or AgentCard pointer is
  emitted in apis.yml, because a pointer would assert that LiquidM publishes a
  surface it does not. A WellKnown pointer written on an earlier round has been
  removed for this reason.

  liquidm.com no longer completes a TLS handshake at all — its certificate
  expired on 2026-07-20 — so every https probe of that host fails at the
  connection layer. Over plain HTTP it 301-redirects to Equativ for every path,
  including /.well-known/*.
