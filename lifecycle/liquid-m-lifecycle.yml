versioning:
  scheme: uri-path
  current: v1
  known_versions: [v1, v2]
  detail: >-
    The Management API carries the version in the path. LiquidM's first-party
    client declares both urlPrefixV1 (https://platform.liquidm.com/api/v1/) and
    urlPrefixV2 (https://platform.liquidm.com/api/v2/) but implements every
    method against v1 only, so the v2 surface is undocumented. The Reporting API
    is unversioned: it is a single /visual_reports.json resource.
  docs: null
  v2_status:
    live: true
    observed: '2026-08-13'
    detail: >-
      The v2 prefix is not a placeholder. It is served, it authenticates, and it
      is a materially different API from v1: v2 answers with content-type
      application/vnd.api+json and a JSON:API error document
      ({"errors":[{"title","detail","status"}]}), where v1 answers with
      application/json and a bare {"error":"..."} string. LiquidM publishes no
      documentation, client or spec for v2, so its resources, payload shapes and
      relationships are unknown. This is the single largest documentation gap on
      the platform: a whole API generation exists in production with no public
      contract.
    caution: >-
      v2 cannot be route-mapped from outside. Unlike v1, its authentication
      filter runs BEFORE routing, so every path under /api/v2/ — including
      deliberately nonsensical ones such as /api/v2/zzz_nonsense_resource —
      returns 401 rather than 404. A 401 from v2 is therefore NOT evidence that a
      resource exists, and no v2 resource names have been recorded from probing.
