surface_coverage:
  method: probed
  observed: '2026-08-13'
  summary: >-
    LiquidM's published Management API client documents 3 collections. Live
    probing of the v1 prefix confirms at least 15. Four-fifths of the documented
    API generation is undocumented.
  technique: >-
    Under /api/v1/, unmatched paths return a real HTTP 404 with the JSON body
    {"error":"No Route Matches"}, while matched paths return HTTP 401
    {"error":"No auth token provided"}. That difference makes route existence
    directly observable without credentials. Four negative controls
    (zzz_nonsense, qqq_control_1, not_a_real_thing_9, xyzzy_control_2) all
    returned 404, confirming the discrimination is real and not a blanket 401.
  documented_collections: [campaigns, budgets, ads]
  confirmed_live_collections:
