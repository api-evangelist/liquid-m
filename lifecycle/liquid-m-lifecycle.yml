decay_signals:
  observed: '2026-08-13'
  note: >-
    The API answers, but every artifact around it has stopped moving. Recorded so
    a consumer can judge maintenance risk before integrating.
  signals:
  - signal: marketing-domain-tls-expired
    detail: >-
      The liquidm.com certificate expired 2026-07-20. The apex no longer
      completes a TLS handshake at all; https requests are aborted before any
      HTTP response. Nobody is renewing the brand's certificate.
    severity: high
  - signal: platform-frontend-frozen
    detail: >-
      The SPA shell served at platform.liquidm.com carries
      last-modified: Thu, 25 Jan 2024 10:30:22 GMT — the front end has not been
      redeployed in over two and a half years.
    severity: medium
  - signal: clients-unmaintained
    detail: >-
      The Reporting API client was last pushed 2022-10-06; the Management API
      client 2019-04-30. Neither is published to a package registry.
    severity: medium
  - signal: only-published-gem-is-2014
    detail: >-
      liquid-ext, the one LiquidM package on a registry, last published 3.5.3 on
      2014-11-13.
    severity: low
  counter_signal: >-
    Against all of the above, the API itself is not abandoned: nginx 1.17.8 is
    serving, the Rails stack answers in single-digit milliseconds (x-runtime
    0.002–0.005s), and a v2 generation exists that postdates every published
    client. The platform is maintained; its public developer surface is not.
corporate:
  status: acquired
  acquirer: Equativ (formerly Smart AdServer)
  announced: '2019-12-18'
  source: https://www.equativ.com/press/smart-acquires-dsp-liquidm
  note: >-
    Smart AdServer — since rebranded Equativ — announced the acquisition of
    LiquidM on 2019-12-18, stating that "LiquidM's technology will be integrated
    into Smart's technology stack". LiquidM was founded in Berlin in 2013 and was
    Bertelsmann-owned at the time of sale. This supersedes the earlier round's
    unsourced observation: the redirect from liquidm.com to
    https://www.equativ.com/advertisers is the brand consolidation that followed
    that transaction, now confirmed against the acquirer's own press release.
    The platform host and both APIs nevertheless remain live and reachable.
