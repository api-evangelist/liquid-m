generated: '2026-08-13'
method: probed
source: >-
  openapi/liquid-m-reporting-openapi.yml, openapi/liquid-m-management-openapi.yml,
  https://github.com/liquidm/liquidm-reporting-api-client/blob/master/README.md,
  live unauthenticated probes of platform.liquidm.com on 2026-08-13
format: http-status
envelopes:
  note: >-
    There is no single error envelope. Three coexist on one platform and an
    integrator must handle all three. Full shapes in
    conventions/liquid-m-conventions.yml#error_envelope.
  v1: '{"error": "<string>"}  (application/json)'
  v2: '{"errors": [{"title","detail","status"}]}  (application/vnd.api+json — a JSON:API error document)'
  reporting: '{}  (application/json — empty, status code only)'
note: >-
  LiquidM does not publish an error-code registry or an RFC 9457 problem+json
  envelope. Its documentation states only that the API uses HTTP return codes,
  with 200 on success and other codes such as 401 when authentication was wrong.
  The problems below are what LiquidM actually documents plus the section-level
  validation errors its first-party client demonstrates. Nothing is inferred
  beyond those sources.
problems:
- status: 401
  title: Authentication failed
  detail: >-
    The auth_token was missing, wrong, or has been invalidated by issuing a newer
    token. Re-issue a token via GET /api/auth.
  remediation: >-
    Request a fresh AUTH_TOKEN from /api/auth and retry. Note that issuing a new
    token invalidates the old one, so a shared token rotated elsewhere will begin
    returning 401.
  source_operation: openapi/liquid-m-reporting-openapi.yml#getVisualReport
  observed: >-
    Live probe of https://platform.liquidm.com/visual_reports.json without a
    token returned HTTP 401 on 2026-07-19; re-confirmed 2026-08-13. The body is
    an empty JSON object, so the status code is the only diagnostic.
- status: 401
  title: No auth token provided
  detail: >-
    The auth_token query parameter was absent from a Management API request.
    Distinct from an invalid token: this is the missing-parameter case.
  remediation: Append auth_token=<AUTH_TOKEN> to the request.
  source_operation: openapi/liquid-m-management-openapi.yml#listCampaigns
  observed: >-
    Live probe of https://platform.liquidm.com/api/v1/campaigns on 2026-08-13
    returned HTTP 401 with body {"error":"No auth token provided"}.
- status: 401
  title: credentials-invalid
  detail: >-
    Token issuance was attempted with missing or wrong platform credentials.
  remediation: >-
    Supply valid email and password query parameters with api=true to
    GET /api/auth.
  source_operation: openapi/liquid-m-reporting-openapi.yml#createAuthToken
  observed: >-
    Live probe of https://platform.liquidm.com/api/auth without credentials on
    2026-08-13 returned HTTP 401 with body {"error":"credentials-invalid"}.
- status: 404
  title: No Route Matches
  detail: >-
    The path is not routed under /api/v1/. Returned as JSON, not HTML, and
    returned before authentication is evaluated.
  remediation: Check the resource path against the Management API surface.
  source_operation: openapi/liquid-m-management-openapi.yml
  observed: >-
    Live probe of https://platform.liquidm.com/api/v1/zzz_nonsense on 2026-08-13
    returned HTTP 404 with body {"error":"No Route Matches"}.
  note: >-
    Because this 404 precedes the auth check on v1, route existence is
    observable without credentials. See the surface_coverage block in
    lifecycle/liquid-m-lifecycle.yml. The v2 prefix behaves the opposite way —
    auth is evaluated first, so v2 returns 401 for unrouted paths and route
    existence there cannot be probed.
validation_errors:
  envelope: meta.errors
  applies_to: openapi/liquid-m-management-openapi.yml#createAd
  shape: >-
    An object keyed by ad section name, each mapping to an array of message
    strings.
  known_sections: [creative, setting, targeting]
  example_message: is not valid
delivery_diagnostics:
  note: >-
    Ads additionally carry non-fatal diagnostic arrays reporting why an ad cannot
    yet deliver. These are not HTTP errors.
  fields:
  - field: delivery_warnings
    example: >-
      Your creative uses non-secure connection(s). Make sure all requested assets
      have a secure connection (https)!
  - field: delivery_errors
    example: Your ad cannot deliver. Some required inputs are missing.
  - field: appnexus_approval_info
    example: AppNexus creative approval is PENDING.
