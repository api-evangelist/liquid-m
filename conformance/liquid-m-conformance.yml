note: >-
  Derived from LiquidM's published documentation and its own vocabulary, with the
  json-api entry corrected against live observation on 2026-08-13. LiquidM
  publishes no certifications and runs no compliance program — no SOC 2, ISO
  27001, PCI DSS, HIPAA or FedRAMP claim appears anywhere, and the security
