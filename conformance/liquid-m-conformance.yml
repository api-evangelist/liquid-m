standards:
- id: openrtb-2.5
  conforms: true
  evidence: >-
    The Reporting API README directs consumers to the IAB OpenRTB API
    Specification Version 2.5 for the standards its reporting refers to, and the
    metric set (bid_requests, bids, win_rate) is OpenRTB auction vocabulary.
  reference: https://www.iab.com/wp-content/uploads/2016/03/OpenRTB-API-Specification-Version-2-5-FINAL.pdf
- id: iab-content-taxonomy
  conforms: true
  evidence: >-
    The category dimension splits by IAB category and campaigns carry a
    category_id.
- id: iab-device-type
  conforms: true
  evidence: The devicetype dimension splits by IAB device type.
- id: iso-4217
  conforms: true
  evidence: >-
    The currency parameter accepts ISO 4217 currency codes; all currencies
    defined by ISO 4217 are supported. Campaigns carry an ISO 4217 currency.
- id: iso-8601
  conforms: true
  evidence: >-
    Reporting start_date/end_date are date strings; budget start_date/end_date
    are ISO 8601 date-times produced by the first-party client.
- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 security scheme. Authentication is a single long-lived auth_token
    passed as a query parameter.
- id: openid-connect
  conforms: false
  evidence: No OIDC discovery document is served; the well-known probe found only SPA soft-404s.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors are signalled by HTTP status code only. No application/problem+json
    responses are documented.
- id: rfc8594-sunset
  conforms: false
  evidence: No Sunset or Deprecation header support is documented.
- id: rfc9116-security-txt
  conforms: false
  evidence: No security.txt is served on platform.liquidm.com or liquidm.com.
- id: json-api
  conforms: partial
  method: probed
  observed: '2026-08-13'
  evidence: >-
    Corrected from conforms:false after live probing. The surface is split. The
    documented v1 Management API and the Reporting API do NOT use JSON:API —
    they return bespoke envelopes (columns/dimensions/rows for reporting, a named
    resource key for management) under application/json. But the undocumented v2
    Management API does: every request to /api/v2/* answers with content-type
    application/vnd.api+json and a JSON:API error document of the form
    {"errors":[{"title":"Authentication error","detail":"No auth token
    provided","status":401}]}. LiquidM also maintains a public fork of
    jsonapi-utils, the Rails JSON:API serialization gem, in its own GitHub
    organization, which corroborates the media type as a deliberate choice
    rather than an artifact of a proxy.
  scope: /api/v2/* only
  limitation: >-
    Only the error document could be observed; success payloads require
    credentials. Whether v2 also implements JSON:API's data/included/relationships
    document structure, sparse fieldsets, compound documents or its pagination
    profile is unverified, and LiquidM publishes no v2 documentation to check
    against. Graded partial rather than true for that reason.
  reference: https://jsonapi.org/format/
  corroboration: https://github.com/liquidm/jsonapi-utils
- id: rest-uri-versioning
  conforms: true
  evidence: Management API paths are prefixed /api/v1/ and /api/v2/.
