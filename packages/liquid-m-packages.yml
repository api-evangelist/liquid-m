note: >-
  LiquidM does not publish its API client libraries to a package registry. The
  Reporting API client is installed directly from git (the README's Gemfile line
  uses a git: source and there is no liquidm-reporting-api-client gem on
  RubyGems), and the Management API client is a single MIT-licensed JavaScript
  file served from its repository. One first-party general-purpose gem
  (liquid-ext) is published to RubyGems under the "LiquidM, Inc." author.
