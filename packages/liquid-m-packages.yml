  registry: git
  name: liquidm-reporting-api-client
  url: https://github.com/liquidm/liquidm-reporting-api-client
  install: "gem 'liquidm-reporting-api-client', git: 'git://github.com/liquidm/liquidm-reporting-api-client.git'"
  official: true
  kind: sdk
  api: openapi/liquid-m-reporting-openapi.yml
  published_registry: false
  note: >-
