aid: liquid-m
name: Liquid M
description: >-
  LiquidM Technology GmbH is a Berlin-based demand-side platform for programmatic
  advertising, founded in 2013 and backed early by Earlybird, later
  Bertelsmann-owned, and acquired by Smart AdServer — now Equativ — in December
  2019. Its platform at platform.liquidm.com exposes two developer surfaces: a
  Reporting API that returns the same data as the platform's Visual Reports UI,
  split across more than thirty dimensions (campaign, ad, site, domain, device,
  geo, audience) and thirty-plus metrics (impressions, bids, bid requests,
  clicks, CTR, win rate, eCPM, conversion funnels, video quartiles); and a
  campaign Management API covering campaigns, budgets and ads. LiquidM publishes
  a first-party MIT-licensed JavaScript client for the Management API and an
  example Ruby client for the Reporting API from a 100-repo public GitHub
  organization, neither released to a package registry. Both APIs remain live and
  authenticate, but the published surface has fallen well behind the deployed
  one: probing confirms fifteen live v1 collections against the three the client
  documents, and an entirely undocumented v2 generation that answers in JSON:API.
  The liquidm.com marketing domain no longer serves HTTPS — its certificate
  expired in July 2026 — and over plain HTTP redirects to Equativ.
