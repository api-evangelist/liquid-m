aid: liquid-m
name: Liquid M
description: >-
  LiquidM Technology GmbH is a Berlin-based demand-side platform for programmatic
  advertising, backed by Earlybird. Its platform at platform.liquidm.com exposes
  two developer surfaces: a Reporting API that returns the same data as the
  platform's Visual Reports UI, split across more than thirty dimensions
  (campaign, ad, site, domain, device, geo, audience) and thirty-plus metrics
  (impressions, bids, bid requests, clicks, CTR, win rate, eCPM, conversion
  funnels, video quartiles); and a campaign Management API covering campaigns,
  budgets and ads. LiquidM publishes a first-party MIT-licensed JavaScript client
  for the Management API and an example Ruby client for the Reporting API from a
  100-repo public GitHub organization. The liquidm.com marketing domain now
  redirects to Equativ, though the platform host and its APIs remain reachable.
